<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合体と連鎖の演出</title>
<style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;color:#efeee7;background:#080b13;font-family:system-ui,sans-serif}body{margin:0;max-width:1200px;margin-inline:auto;padding:20px}h1{margin:0 0 14px;font-size:24px}button,select,input{font:inherit}button,select{color:#fff;cursor:pointer;background:#263447;border:0;padding:9px 12px}button:hover{background:#45586e}button:focus-visible,input:focus-visible{outline-offset:2px;outline:3px solid #ffc574}#demo-controls{border-block:1px solid #344154;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;display:flex}#readout{white-space:pre-wrap;color:#b9c9d9;min-height:3.5em;font:13px/1.7 ui-monospace,monospace}#view{background:#070b18;width:100%;height:auto;display:block}label{align-items:center;gap:8px;display:inline-flex}#timeline{width:230px}#frames{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:16px;display:grid}#frames canvas{width:100%;height:auto}p{color:#b9c9d9;font-size:14px;line-height:1.6}#download{color:#ffd797}summary{cursor:pointer}ol{columns:2;padding-left:24px;font-size:13px;line-height:1.8}@media (width<=650px){body{padding:10px}#frames{grid-template-columns:repeat(3,minmax(0,1fr))}ol{columns:1}}</style>  <script type="module" crossorigin src="../assets/juice-CYRHDD-i.js"></script>

<body><h1>合体と連鎖の演出</h1>
<div id="demo-controls">
  <button data-chain="1">連鎖1</button><button data-chain="2">連鎖2</button><button data-chain="3">連鎖3</button><button data-chain="4">連鎖4</button><button data-chain="5">連鎖5</button>
  <button id="giant">巨大惑星の合体</button><button id="nova">超新星</button><button id="ladder">1→5を続ける</button>
  <button id="record">比較動画を作る</button><button id="filmstrip">1コマごとの画像</button><button id="stress">毎秒10回を測る</button><button id="stop">停止</button>
  <label><input type="checkbox" id="sound" checked>効果音</label><button id="verify-sound">効果音を測る・保存する</button>
  <label><input type="checkbox" id="reduced">動きを減らす</label><label><input type="checkbox" id="compare" checked>前回と並べる</label>
</div>
<p id="readout" role="status">同じ盤面で、左は前回・右は今回。ボタンで出来事を起こします。</p>
<pre id="sound-report" role="status"></pre><nav id="sound-files"></nav>
<canvas id="view" width="1120" height="600" role="img" aria-label="同じ盤面の前回と今回の演出"></canvas>
<p><label>時刻 <input id="timeline" type="range" min="0" max="160" value="0"><output id="time">0.000秒</output></label>　<a id="download" hidden>比較動画を保存</a></p>
<div id="frames"></div>
<details><summary>重ねている層</summary><ol id="layers"></ol></details>
<p>合体の前後は本物のゲーム計算で作り、連鎖の段だけ選んで比較します。ゲーム本体も同じ演出と効果音を使います。時間の停止・スローは本番の進行役に依頼します。比較動画は音なし、効果音はWAVで保存できます。</p></body></html>
