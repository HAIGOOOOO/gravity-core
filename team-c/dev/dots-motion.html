<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>点の動き | GRAVITY CORE</title>
  <script type="module" crossorigin src="../assets/dots-motion-BKlZduz6.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="stylesheet" crossorigin href="../assets/dots-motion-DtzLmqeP.css">
</head>
<body>
  <main>
    <header class="masthead"><span>GRAVITY CORE</span><a href="./rules.html">ルール練習</a></header>
    <h1>点の動き</h1>
    <div class="controls" id="demo-controls">
      <div class="choices" role="group" aria-label="出来事">
        <button type="button" data-clip="merge" aria-pressed="true">合体1回</button>
        <button type="button" data-clip="chain" aria-pressed="false">5連鎖</button>
        <button type="button" data-clip="nova" aria-pressed="false">超新星</button>
      </div>
      <label class="motion-setting"><input type="checkbox" id="reduced-motion"> 動きを減らす</label>
    </div>
    <div class="preview-choices choices" role="group" aria-label="表示する動きの案">
      <button type="button" data-choice="flow" aria-pressed="true">A 流入</button>
      <button type="button" data-choice="flip" aria-pressed="false">B 反転</button>
      <button type="button" data-choice="field" aria-pressed="false">C 引力</button>
    </div>
    <div class="transport">
      <div class="hud">
        <span>時刻 <output id="clock" for="timeline" aria-live="off">0.96 / 3.00 秒</output></span>
        <span>得点 <output id="score" aria-live="off">18,520</output></span>
        <span>核熱 <output id="heat" aria-live="off">60</output></span>
      </div>
      <div class="playback">
        <button id="play" class="play" type="button">再生</button>
        <label class="timeline">再生位置 <input id="timeline" type="range" min="0" max="300" value="96"></label>
      </div>
    </div>
    <section class="previews" aria-label="演出案">
      <figure data-preview="flow" data-current="true">
        <figcaption><h2>A <span>流入</span></h2><p>射出した天体の点が、合体先へ一筋に集まる。</p></figcaption>
        <canvas aria-label="流入の演出" role="img"></canvas>
      </figure>
      <figure data-preview="flip" data-current="false">
        <figcaption><h2>B <span>反転</span></h2><p>合体点から、点の明るさが順に切り替わる。</p></figcaption>
        <canvas aria-label="反転の演出" role="img"></canvas>
      </figure>
      <figure data-preview="field" data-current="false">
        <figcaption><h2>C <span>引力</span></h2><p>天体のそばの格子が引かれ、合体のあと元へ戻る。</p></figcaption>
        <canvas aria-label="引力の演出" role="img"></canvas>
      </figure>
    </section>
    <div class="footer-controls">
      <div class="queue">
        <span>次の天体</span>
        <canvas data-next="0" role="img" aria-label="小粒子"></canvas>
        <canvas data-next="1" role="img" aria-label="隕石"></canvas>
        <canvas data-next="2" role="img" aria-label="小惑星"></canvas>
      </div>
    </div>
  </main>
</body>
</html>
