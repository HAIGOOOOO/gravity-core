<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プレイを見返す — GRAVITY CORE</title>
    <script type="module" crossorigin src="../assets/bodies-CptjCEtv.js"></script>
    <script type="module" crossorigin src="../assets/render-DNwkCQTg.js"></script>
    <script type="module" crossorigin src="../assets/replay-DvNrR5mA.js"></script>
    <script type="module" crossorigin src="../assets/fixtures-CbNCl200.js"></script>
    <script type="module" crossorigin src="../assets/replay-demo-DjWbAQAH.js"></script>
    <link rel="stylesheet" crossorigin href="../assets/replay-demo-CJ96V6tf.css">
  </head>
  <body>
    <main class="replay-page">
      <header><p class="eyebrow">担当 B・再生の見本</p><h1>プレイを見返す</h1></header>
      <div id="demo-controls" aria-label="見本の操作">
        <div><p class="control-label">記録を選ぶ</p><div id="sample-controls"></div></div>
        <div><p class="control-label">選んだ記録を見返す</p><div id="record-jumps"></div><p id="cause-availability"></p></div>
        <div id="preparation-controls"></div>
      </div>
      <p id="preparation-note" role="status"></p>
      <div class="replay-layout">
        <section aria-label="再生する盤面">
          <p id="sample-name"></p>
          <canvas id="board" aria-label="記録したプレイの盤面"></canvas>
          <p id="event-context" role="status"></p>
          <div class="readout"><span id="score"></span><span id="heat"></span></div>
          <p id="cause-context" role="status"></p>
          <label class="timeline">再生位置 <output id="time"></output><input id="timeline" type="range" min="0" max="0" value="0" step="1" /></label>
          <p id="timeline-window"></p>
          <p class="control-label">見どころの印（件数を押すと周辺へ移動して拡大）</p>
          <div id="timeline-markers" aria-label="見どころの位置"></div>
          <p id="selected-highlight"></p>
          <div id="transport" aria-label="再生操作"></div><div id="highlight-nav"></div>
          <p id="status"></p>
        </section>
        <aside>
          <h2>見返す場所</h2><div id="highlights"></div>
          <h2>熱が上がった理由</h2><p id="cause"></p>
          <details>
            <summary>このプレイを残す・記録を開く</summary>
            <section><h3>表示中のプレイを端末に残す</h3>
              <p>見本用の保存は1件です。次に保存すると置き換わります。</p>
              <p id="record-size"></p><p id="saved-record"></p><div id="save-controls"></div>
              <p id="save-notice" role="status"></p>
            </section>
            <section><h3>表示中の記録を持ち出す</h3><div id="export-controls"></div><p id="export-notice" role="status"></p></section>
            <section><h3>別の記録を貼って開く</h3>
              <label>保存した記録ファイル <input id="record-file" type="file" accept=".json,application/json" /></label>
              <label>コピーした再生の記録<textarea id="record-text" rows="4" spellcheck="false" placeholder="記録の全文をここに貼ってください"></textarea></label>
              <button id="import-record" type="button">貼った記録を開く</button><p id="import-notice" role="status"></p><div id="import-controls"></div>
            </section>
          </details>
        </aside>
      </div>
    </main>
  </body>
</html>
