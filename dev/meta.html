<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プレイを見返す — GRAVITY CORE</title>
  </head>
  <body>
    <main class="replay-page">
      <header><p class="eyebrow">担当 B・再生の見本</p><h1>プレイを見返す</h1></header>
      <div id="demo-controls" aria-label="見本の操作"></div>
      <div class="replay-layout">
        <section aria-label="再生する盤面">
          <p id="sample-name"></p>
          <canvas id="board" aria-label="記録したプレイの盤面"></canvas>
          <p id="event-context" role="status"></p>
          <div class="readout"><span id="score"></span><span id="heat"></span></div>
          <p id="cause-context" role="status"></p>
          <label class="timeline">再生位置 <output id="time"></output><input id="timeline" type="range" min="0" max="0" value="0" step="1" /></label>
          <div id="transport" aria-label="再生操作"></div>
          <p id="status" role="status" aria-live="polite"></p>
        </section>
        <aside>
          <h2>見返す場所</h2><div id="highlights"></div>
          <h2>熱が上がった理由</h2><p id="cause"></p>
          <details><summary>この端末に保存・読み込み</summary><p>見本用の記録を1件保存します。</p><div id="save-controls"></div><label>再生の記録<textarea id="record-text" rows="4" spellcheck="false"></textarea></label><button id="import-record" type="button">貼った記録を開く</button></details>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/dev/replay-demo.ts"></script>
  </body>
</html>
