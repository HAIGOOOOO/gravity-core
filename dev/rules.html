<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>連鎖で熱を逃がす | GRAVITY CORE</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101619;color:#f0ece0}body{max-width:1120px;margin:auto;padding:24px}a{color:#afcdb6}h1{font-size:clamp(26px,4vw,42px);margin:12px 0}p{color:#c0c3bb;line-height:1.7}main{display:grid;grid-template-columns:minmax(0,640px) minmax(250px,1fr);gap:28px}#stage{position:relative;aspect-ratio:1;max-width:640px;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}#effects{pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{font:inherit;border:1px solid #647467;color:#eee9da;background:#25322b;padding:10px 14px;cursor:pointer}button:focus-visible{outline:3px solid #e1b96c;outline-offset:3px}meter{width:100%;height:22px}#heat{font-size:56px;font-weight:650;font-variant-numeric:tabular-nums}#cooling{height:32px;color:#b2e6bc;font-size:22px}ol{padding-left:22px;line-height:1.8;font-variant-numeric:tabular-nums}#mode{min-height:4em}small{color:#a7afa4}#facts{line-height:1.8;white-space:pre-line}.eyebrow{font-size:12px;letter-spacing:.16em;color:#bca376}@media(max-width:760px){body{padding:16px}main{grid-template-columns:1fr}aside{max-width:640px}#heat{font-size:42px}}
main{margin-top:20px}.controls{margin:10px 0}button:disabled{opacity:.45;cursor:default}#mode{min-height:0}#balance{font-size:14px}#intervention-status,#profile-result{font-size:14px}
#practice-actions{padding:12px;border-left:4px solid #b2e6bc;background:#1a2623}#practice-actions:has(>div:not([hidden])){margin-bottom:16px}#practice-actions:has(>div[hidden]):not(:has(>div:not([hidden]))){display:none}#mode-title{font-size:20px;margin:0 0 12px}button[aria-pressed=true]{border-color:#b2e6bc;background:#3b5142}#latest-event{min-height:1.5em;color:#b2e6bc;font-weight:600}details{font-size:14px;color:#a7afa4;margin-top:16px}
@media(min-width:761px){main{grid-template-columns:minmax(260px,var(--board-size,640px)) minmax(260px,1fr)}}
</style></head><body>
<span class="eyebrow">GRAVITY CORE / RULE STUDY 01</span><h1>連鎖で、熱を逃がす。</h1>
<p>つなげた合体が、危険な熱を取り戻す。一投ごとの出現順は、決まった組を混ぜた袋から。</p>
<nav><a href="/">ゲーム本体で遊ぶ</a>　<a href="./juice.html">演出の比較</a></nav>
<main><div id="stage"><canvas id="board" aria-label="重力核のまわりへ天体を落とす盤面"></canvas><canvas id="effects"></canvas></div>
<aside><h2 id="mode-title"></h2><div id="practice-actions"><div id="collapse-actions" hidden><button id="practice-shot">1. 一投する</button> <button id="collapse" disabled>2. 崩壊</button><p id="intervention-status" role="status"></p></div><div id="growth-actions" hidden><button id="growth-launch" disabled>この照準で撃つ</button></div></div><p id="mode"></p><div id="latest-event" role="status"></div><small>核熱量 / 100</small><div id="heat">80.0</div><meter id="meter" min="0" max="100" low="50" high="75" optimum="0" value="80"></meter><div id="cooling" role="status"></div><div id="facts"></div>
<div class="controls"><button id="play">自由に遊ぶ</button><button id="learn">一投で2連鎖を作る</button><button data-chain="1">単発の冷却</button><button data-chain="3">3連鎖目の冷却</button><button data-chain="5">5連鎖目の冷却</button><button id="pause">一時停止</button><label><input id="sound" type="checkbox">音あり</label></div>
<div class="controls"><button id="intervention-practice">崩壊の練習</button><button id="growth-preview">成長で押す範囲を見る</button></div>
<details><summary>熱の内訳・記録・計測</summary><p id="balance"></p><h2>起きたこと</h2><ol id="events" aria-live="off"></ol><p>単発・3・5連鎖目の冷却見本は、その合体の直前から再生します。連鎖を最初から成功させた映像ではありません。</p><button id="profile">180コマ計測</button><span id="profile-result" role="status"></span></details></aside></main>
<script type="module" src="../src/dev/rules-demo.ts"></script></body></html>
