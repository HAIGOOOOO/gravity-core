<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>連鎖で熱を逃がす | GRAVITY CORE</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101619;color:#f0ece0}body{max-width:1120px;margin:auto;padding:24px}a{color:#afcdb6}h1{font-size:clamp(26px,4vw,36px);margin:8px 0}p{color:#c0c3bb;line-height:1.65}header p{margin:8px 0}main{display:grid;grid-template-columns:minmax(260px,var(--board-size,640px)) minmax(280px,1fr);gap:28px;margin-top:20px}#stage{position:relative;aspect-ratio:1;max-width:640px;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}#effects,#trace{pointer-events:none}#trace{z-index:2}button{font:inherit;border:1px solid #647467;color:#eee9da;background:#25322b;padding:9px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #e1b96c;outline-offset:3px}button[aria-pressed=true]{border-color:#b2e6bc;background:#3b5142}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#practice-actions:has(>div:not([hidden])){padding:12px;border-left:4px solid #b2e6bc;background:#1a2623;margin-bottom:12px}#mode-title{font-size:22px;margin:0 0 12px}#lesson-result{font-weight:650;color:#c5f4cb;min-height:1.5em}#heat{font-size:44px;font-weight:650;font-variant-numeric:tabular-nums}meter,progress{width:100%;height:18px}progress{accent-color:#b2e6bc}#receipt{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-variant-numeric:tabular-nums}#cooling,#collapse-cooling{color:#b2e6bc}#passive{color:#a7afa4}#facts,#balance,#latest-event{font-size:14px;font-variant-numeric:tabular-nums}#queue{display:flex;gap:16px;height:48px}#queue canvas{position:static;width:48px;height:48px}#trace-controls{font-size:14px}#comparison{line-height:1.6}details{font-size:14px;color:#a7afa4;margin-top:16px}ol{padding-left:22px;line-height:1.8}small{color:#a7afa4}.eyebrow{font-size:12px;letter-spacing:.16em;color:#bca376}@media(max-width:760px){body{padding:16px}main{grid-template-columns:1fr;gap:16px}#stage{width:100%}#heat{font-size:36px}}
[hidden]{display:none!important}
</style></head><body>
<header><span class="eyebrow">GRAVITY CORE / RULE STUDY 01</span><h1>連鎖で、熱を逃がす。</h1><p>一投からつながる合体と、撃った後の一手を試す。</p><nav><a href="/">ゲーム本体で遊ぶ</a>　<a href="./juice.html">演出の比較</a></nav></header>
<main><div id="stage"><canvas id="board" aria-label="重力核のまわりへ天体を落とす盤面"></canvas><canvas id="effects"></canvas><canvas id="trace" aria-hidden="true"></canvas></div>
<aside><h2 id="mode-title"></h2>
<div id="practice-actions"><div id="collapse-actions" hidden><button id="practice-shot">1. 一投する</button> <button id="collapse" disabled>2. 崩壊</button><p id="intervention-status"></p><progress id="window-left" aria-label="崩壊を受け付ける残り時間" max="1.2" value="0"></progress></div><div id="growth-actions" hidden><button id="growth-launch">この照準で撃つ</button></div></div>
<p id="mode"></p><p id="lesson-result" role="status"></p><div id="result-actions" class="controls" hidden><button id="try-again">もう一度</button><button id="next-lesson">次へ</button></div>
<div id="trace-controls" hidden><label><input id="compare" type="checkbox" checked>前と予告を重ねる</label><p>灰点線: 元の位置 / 赤破線: 予告 / 青線: 実際の移動</p><p id="comparison"></p></div>
<small>核熱量 / 100</small><div id="heat">80.0</div><meter id="meter" aria-label="核熱量" min="0" max="100" low="50" high="75" optimum="0" value="80"></meter>
<div id="receipt"><span id="cooling"></span><span id="collapse-cooling"></span><span id="passive"></span></div><p id="facts"></p><small>次に出る天体（左から）</small><div id="queue"></div><p id="latest-event"></p>
<nav class="controls" aria-label="練習を選ぶ"><button id="learn" data-mode="learn">1. 連鎖</button><button id="intervention-practice" data-mode="collapse">2. 崩壊</button><button id="growth-preview" data-mode="growth">3. 成長</button></nav>
<div class="controls"><button id="play" data-mode="play">自由プレイ</button><button id="pause">一時停止</button><label><input id="sound" type="checkbox">音あり</label></div>
<details><summary>冷却見本・内訳・計測</summary><p>単発・3・5連鎖目は、その合体の直前から再生します。</p><div class="controls"><button data-mode="1">単発</button><button data-mode="3">3連鎖目</button><button data-mode="5">5連鎖目</button></div><p id="balance"></p><ol id="events" aria-live="off"></ol><button id="profile">180コマ計測</button><p id="profile-result" role="status"></p></details>
</aside></main><script type="module" src="../src/dev/rules-demo.ts"></script></body></html>
