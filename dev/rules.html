<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>連鎖で熱を逃がす | GRAVITY CORE</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101619;color:#f0ece0;font-size:16px}
*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:20px}a{color:#afcdb6}h1{font-size:32px;margin:4px 0}p{color:#c0c3bb;line-height:1.55;margin:10px 0}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header nav{font-size:14px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#bca376}
.lesson-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #435047;padding:12px 0;margin-bottom:18px}.controls{display:flex;flex-wrap:wrap;gap:8px}.lesson-nav .controls{gap:4px}button{font:inherit;border:1px solid #647467;color:#eee9da;background:#25322b;padding:9px 12px;cursor:pointer;min-height:40px}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #e1b96c;outline-offset:3px}button[aria-pressed=true]{border-color:#b2e6bc;background:#3b5142}.lesson-nav button{font-size:14px;padding:8px 10px}.lesson-nav label{align-self:center;white-space:nowrap;font-size:14px}
main{display:grid;grid-template-columns:minmax(300px,var(--board-size,640px)) minmax(280px,1fr);gap:24px;align-items:start}#board-stack{position:sticky;top:12px}#stage{position:relative;aspect-ratio:1;touch-action:none;background:#070b18}canvas{position:absolute;inset:0;width:100%;height:100%}#effects,#trace{pointer-events:none}#trace{z-index:2}#mobile-hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px 12px;padding:8px 0;font-variant-numeric:tabular-nums}#mobile-heat{font-size:22px}#heat-cause{flex-basis:100%;font-size:14px;color:#b2e6bc}#heat-cause[data-state=rising]{color:#ff9398}#mobile-queue{font-size:12px;color:#b7beb4}#aim-feedback{font-size:14px;color:#ffd28d;margin:0}#aim-feedback:empty{display:none}
aside{min-width:0}#mode-title{font-size:22px;margin:0 0 12px}#practice-actions:has(>div:not([hidden])){padding:12px;border-left:4px solid #b2e6bc;background:#1a2623}#practice-actions button,#repeat-actions button,#loss-start,#free-collapse{border-color:#b2e6bc;background:#3b5142}#collapse-actions label{font-size:14px;display:block;margin-bottom:8px}#intervention-status{font-size:14px}progress,meter{width:100%;height:14px}progress{accent-color:#b2e6bc}#repeat-actions .controls{margin-top:8px}#repeat-history{font-size:14px}#lesson-result{font-size:22px;font-weight:700;color:#c5f4cb}#lesson-result:empty{display:none}#result-actions{margin:12px 0}#defeat-panel{border-left:4px solid #ff9398;padding:8px 12px;background:#261b1c;font-size:18px;font-weight:650}#input-feedback{color:#ffd28d;font-size:14px}#input-feedback:empty,#shot-readiness:empty{display:none}#shot-readiness{font-size:14px}#heat{font-size:38px;font-weight:650;font-variant-numeric:tabular-nums}#heat-panel{margin-top:14px}#facts{font-size:14px;color:#a7afa4}#queue{display:flex;gap:16px;height:48px}#queue canvas{position:static;width:48px;height:48px}#queue-panel{margin:12px 0}#trace-controls{font-size:14px}#comparison{line-height:1.6}details{font-size:14px;color:#a7afa4;margin-top:16px;border-top:1px solid #435047;padding-top:12px}summary{cursor:pointer;padding:6px 0}details .controls{margin:8px 0}#receipt{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0}#cooling,#collapse-cooling{color:#b2e6bc}ol{padding-left:22px;line-height:1.8}small{color:#a7afa4}[hidden]{display:none!important}
@media(max-width:760px){body{padding:10px 12px}header{align-items:flex-start;gap:8px}h1{font-size:22px;white-space:nowrap}.eyebrow{display:none}header nav{font-size:12px;line-height:1.5;max-width:112px}.lesson-nav{display:block;padding:8px 0;margin-bottom:10px}.lesson-nav nav{flex-wrap:nowrap;gap:4px;justify-content:space-between}.lesson-nav nav button{font-size:13px;padding:7px 8px;flex:1;white-space:nowrap}.lesson-nav>.controls{margin-top:6px}.lesson-nav>.controls button{font-size:12px;min-height:30px;padding:4px 8px}.lesson-nav label{font-size:12px}.lesson-nav input{vertical-align:middle}main{display:flex;flex-direction:column;gap:8px}#board-stack{position:static;width:min(100%,42dvh);align-self:center}#mobile-hud{padding:5px 0;gap:3px 8px}#mobile-heat{font-size:18px}#mobile-queue{font-size:11px}#heat-cause{font-size:13px;line-height:1.3}aside{width:100%}#mode-title{font-size:18px;margin-bottom:8px}#practice-actions{padding:8px!important}#mode{font-size:14px;line-height:1.45}#lesson-result{font-size:20px;margin:8px 0}#heat-panel,#queue-panel,#facts{display:none}#repeat-history{margin:6px 0}#repeat-actions button{font-size:14px}#free-intervention{font-size:14px}#intervention-status{margin:6px 0}#collapse-actions label{font-size:13px}#result-actions{margin:8px 0}details{margin-top:12px}}
</style></head><body>
<header><div><span class="eyebrow">GRAVITY CORE / RULE STUDY 01</span><h1>連鎖で、熱を逃がす。</h1></div><nav><a href="/">ゲーム本体で遊ぶ</a><br><a href="./juice.html">演出の比較</a></nav></header>
<div class="lesson-nav"><nav class="controls" aria-label="練習を選ぶ"><button id="learn" data-mode="learn">1. 連鎖</button><button id="intervention-practice" data-mode="collapse">2. 崩壊</button><button id="growth-preview" data-mode="growth">3. 成長</button><button id="repeat-training" data-mode="repeat">4. 連投</button><button data-mode="loss">5. 敗因</button></nav><div class="controls"><button id="play" data-mode="play">自由プレイ</button><button id="restart-play" hidden>最初から</button><button id="pause">一時停止</button><label><input id="sound" type="checkbox">音あり</label></div></div>
<main><div id="board-stack"><div id="stage"><canvas id="board" aria-label="重力核のまわりへ天体を落とす盤面"></canvas><canvas id="effects"></canvas><canvas id="trace" aria-hidden="true"></canvas></div><div id="mobile-hud"><strong id="mobile-heat"></strong><span id="mobile-queue"></span><span id="heat-cause"></span></div><p id="aim-feedback"></p></div>
<aside id="study-panel"><h2 id="mode-title"></h2>
<div id="practice-actions"><div id="learn-actions"><button id="learn-launch">真上から一投する</button></div><div id="collapse-actions" hidden><label><input id="guided-collapse" type="checkbox" checked>射出後に止めて操作を確認</label><button id="practice-shot">1. 一投する</button><p id="intervention-status"></p><progress id="window-left" aria-label="崩壊を受け付ける残り時間" max="1.2" value="0"></progress></div><div id="growth-actions" hidden><button id="growth-launch">この照準で撃つ</button></div></div>
<div id="repeat-actions" hidden><p id="repeat-history"></p><div class="controls"><button id="repeat-same">右から</button><button id="repeat-other">左から</button></div></div>
<div id="loss-actions" hidden><button id="loss-start">終了の原因を見る</button><div class="controls"><button data-mode="loss">限界外の山</button><button data-mode="loss-repeat">連投の加熱</button></div></div><div id="free-actions" hidden><button id="free-collapse" disabled>崩壊</button><p id="free-intervention"></p></div><p id="mode"></p><p id="shot-readiness"></p><p id="input-feedback" role="status"></p><p id="lesson-result" role="status"></p><p id="defeat-panel" hidden></p><div id="result-actions" class="controls" hidden><button id="try-again">もう一度</button><button id="next-lesson">次へ</button></div>
<div id="trace-controls" hidden><label><input id="compare" type="checkbox" checked>前と予告を重ねる</label><p>灰点線: 元の位置 / 赤破線: 予告 / 青線: 実際の移動</p><p id="comparison"></p></div>
<div id="heat-panel"><small>核熱量 / 100</small><div id="heat">80</div><meter id="meter" aria-label="核熱量" min="0" max="100" low="50" high="75" optimum="0" value="80"></meter></div><p id="facts"></p><div id="queue-panel"><small>次に出る天体（左から）</small><div id="queue"></div></div>
<details><summary>冷却見本・内訳・計測</summary><p>単発・3・5連鎖目は、その合体の直前から再生します。</p><div class="controls"><button data-mode="1">単発</button><button data-mode="3">3連鎖目</button><button data-mode="5">5連鎖目</button></div><div class="controls"><button data-mode="loss">限界外の敗因</button><button data-mode="loss-repeat">連投の敗因</button></div><div id="receipt"><span id="shot-heating"></span><span id="cooling"></span><span id="collapse-cooling"></span><span id="passive"></span></div><p id="fusion-change" hidden></p><p id="latest-event"></p><p id="balance"></p><ol id="events" aria-live="off"></ol><button id="profile">180コマ計測</button><p id="profile-result" role="status"></p></details>
</aside></main><script type="module" src="../src/dev/rules-demo.ts"></script></body></html>
