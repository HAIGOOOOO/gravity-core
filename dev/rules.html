<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>連鎖で熱を逃がす | GRAVITY CORE</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101619;color:#f0ece0}body{max-width:1120px;margin:auto;padding:24px}a{color:#afcdb6}h1{font-size:clamp(26px,4vw,36px);margin:8px 0}p{color:#c0c3bb;line-height:1.65}header p{margin:8px 0}main{display:grid;grid-template-columns:minmax(260px,var(--board-size,640px)) minmax(280px,1fr);gap:28px;margin-top:20px}#stage{position:relative;aspect-ratio:1;max-width:640px;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}#effects,#trace{pointer-events:none}#trace{z-index:2}button{font:inherit;border:1px solid #647467;color:#eee9da;background:#25322b;padding:9px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #e1b96c;outline-offset:3px}button[aria-pressed=true]{border-color:#b2e6bc;background:#3b5142}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#practice-actions:has(>div:not([hidden])){padding:12px;border-left:4px solid #b2e6bc;background:#1a2623;margin-bottom:12px}#mode-title{font-size:22px;margin:0 0 12px}#lesson-result{font-weight:650;color:#c5f4cb;min-height:1.5em}#heat{font-size:44px;font-weight:650;font-variant-numeric:tabular-nums}meter,progress{width:100%;height:18px}progress{accent-color:#b2e6bc}#receipt{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-variant-numeric:tabular-nums}#cooling,#collapse-cooling{color:#b2e6bc}#passive{color:#a7afa4}#facts,#balance,#latest-event{font-size:14px;font-variant-numeric:tabular-nums}#queue{display:flex;gap:16px;height:48px}#queue canvas{position:static;width:48px;height:48px}#trace-controls{font-size:14px}#comparison{line-height:1.6}details{font-size:14px;color:#a7afa4;margin-top:16px}ol{padding-left:22px;line-height:1.8}small{color:#a7afa4}.eyebrow{font-size:12px;letter-spacing:.16em;color:#bca376}@media(max-width:760px){body{padding:16px}main{grid-template-columns:1fr;gap:16px}#stage{width:100%}#heat{font-size:36px}}
[hidden]{display:none!important}#fusion-change{font-size:20px;font-weight:700;color:#c5f4cb}#mobile-hud{display:none;pointer-events:none;position:absolute;top:4px;left:6px;right:6px;z-index:3;background:#101619dc;padding:6px;font-size:13px}#mobile-hud span{font-size:11px}@media(max-width:760px){main{display:block}#stage{position:sticky;top:0;z-index:2;background:#070b18}aside{margin-top:12px}#mobile-hud{display:flex;flex-direction:column;gap:3px}}aside{max-height:var(--board-size,640px);overflow-y:auto;padding-right:6px}.lesson-nav{position:sticky;top:0;background:#101619;z-index:3;padding-bottom:4px}.lesson-nav .controls{margin:0 0 8px}@media(max-width:760px){aside{max-height:none;overflow:visible}header>p{display:none}body{padding:12px}h1{font-size:26px}.lesson-nav{position:static}}
@media(max-width:760px){body{height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}header{flex:0 0 auto}main{display:flex;flex:1;min-height:0;flex-direction:column;margin-top:8px;gap:8px}#board-stack{position:relative;flex:0 0 auto;width:100%;max-width:min(100%,38dvh);align-self:center}#stage{position:relative;top:auto;z-index:auto}#mobile-hud{position:relative;top:auto;left:auto;right:auto;display:flex;flex-direction:column;gap:2px;background:#101619;padding:4px}aside{min-height:0;flex:1;max-height:none;overflow-y:auto;margin-top:0;padding-bottom:16px}.lesson-nav{position:static}}</style></head><body>
<header><span class="eyebrow">GRAVITY CORE / RULE STUDY 01</span><h1>連鎖で、熱を逃がす。</h1><p>一投からつながる合体と、撃った後の一手を試す。</p><nav><a href="/">ゲーム本体で遊ぶ</a>　<a href="./juice.html">演出の比較</a></nav></header>
<main><div id="board-stack"><div id="stage"><canvas id="board" aria-label="重力核のまわりへ天体を落とす盤面"></canvas><canvas id="effects"></canvas><canvas id="trace" aria-hidden="true"></canvas></div><div id="mobile-hud"><strong id="mobile-heat"></strong><span id="mobile-queue"></span></div></div>
<aside id="study-panel"><div class="lesson-nav"><nav class="controls" aria-label="練習を選ぶ"><button id="learn" data-mode="learn">1. 連鎖</button><button id="intervention-practice" data-mode="collapse">2. 崩壊</button><button id="growth-preview" data-mode="growth">3. 成長</button><button id="repeat-training" data-mode="repeat">4. 連投</button></nav>
<div class="controls"><button id="play" data-mode="play">自由プレイ</button><button id="restart-play" hidden>最初から</button><button id="pause">一時停止</button><label><input id="sound" type="checkbox">音あり</label></div></div><h2 id="mode-title"></h2>
<div id="practice-actions"><div id="learn-actions"><button id="learn-launch">真上から一投する</button></div><div id="collapse-actions" hidden><label><input id="guided-collapse" type="checkbox" checked>射出後に止めて操作を確認</label><br><button id="practice-shot">1. 一投する</button><p id="intervention-status"></p><progress id="window-left" aria-label="崩壊を受け付ける残り時間" max="1.2" value="0"></progress></div><div id="growth-actions" hidden><button id="growth-launch">この照準で撃つ</button></div></div>
<div id="repeat-actions" hidden><button id="repeat-same">同じ方角へ</button> <button id="repeat-other">反対の方角へ</button></div><div id="free-actions" hidden><button id="free-collapse" disabled>崩壊</button><p id="free-intervention"></p></div><p id="mode"></p><p id="fusion-change" hidden></p><p id="lesson-result" role="status"></p><div id="result-actions" class="controls" hidden><button id="try-again">もう一度</button><button id="next-lesson">次へ</button></div>
<div id="trace-controls" hidden><label><input id="compare" type="checkbox" checked>前と予告を重ねる</label><p>灰点線: 元の位置 / 赤破線: 予告 / 青線: 実際の移動</p><p id="comparison"></p></div>
<small>核熱量 / 100</small><div id="heat">80.0</div><meter id="meter" aria-label="核熱量" min="0" max="100" low="50" high="75" optimum="0" value="80"></meter>
<div id="receipt"><span id="shot-heating"></span><span id="cooling"></span><span id="collapse-cooling"></span><span id="passive"></span></div><p id="facts"></p><div id="queue-panel"><small>次に出る天体（左から）</small><div id="queue"></div></div><p id="latest-event"></p>

<details><summary>冷却見本・内訳・計測</summary><p>単発・3・5連鎖目は、その合体の直前から再生します。</p><div class="controls"><button data-mode="1">単発</button><button data-mode="3">3連鎖目</button><button data-mode="5">5連鎖目</button></div><p id="balance"></p><ol id="events" aria-live="off"></ol><button id="profile">180コマ計測</button><p id="profile-result" role="status"></p></details>
</aside></main><script type="module" src="../src/dev/rules-demo.ts"></script></body></html>
