<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合体と連鎖の演出</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080b13;color:#efeee7}body{margin:0;padding:20px;max-width:1200px;margin-inline:auto}h1{font-size:24px;margin:0 0 14px}button,select,input{font:inherit}button,select{border:0;background:#263447;color:#fff;padding:9px 12px;cursor:pointer}button:hover{background:#45586e}button:focus-visible,input:focus-visible{outline:3px solid #ffc574;outline-offset:2px}#demo-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-block:1px solid #344154;padding:12px 0}#readout{font:13px/1.7 ui-monospace,monospace;white-space:pre-wrap;min-height:3.5em;color:#b9c9d9}#view{display:block;width:100%;height:auto;background:#070b18}label{display:inline-flex;gap:8px;align-items:center}#timeline{width:230px}#frames{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:16px}#frames canvas{width:100%;height:auto}p{line-height:1.6;color:#b9c9d9;font-size:14px}#download{color:#ffd797}summary{cursor:pointer}ol{columns:2;font-size:13px;line-height:1.8;padding-left:24px}@media(max-width:650px){body{padding:10px}#frames{grid-template-columns:repeat(3,minmax(0,1fr))}ol{columns:1}}
</style></head>
<body><h1>合体と連鎖の演出</h1>
<div id="demo-controls">
  <button data-chain="1">連鎖1</button><button data-chain="2">連鎖2</button><button data-chain="3">連鎖3</button><button data-chain="4">連鎖4</button><button data-chain="5">連鎖5</button>
  <button id="giant">巨大惑星の合体</button><button id="nova">超新星</button><button id="ladder">1→5を続ける</button>
  <button id="record">比較動画を作る</button><button id="filmstrip">1コマごとの画像</button><button id="stress">毎秒10回を測る</button><button id="stop">停止</button>
  <label><input type="checkbox" id="reduced">動きを減らす</label><label><input type="checkbox" id="compare" checked>前回と並べる</label>
</div>
<p id="readout" role="status">同じ盤面で、左は前回・右は今回。ボタンで出来事を起こします。</p>
<canvas id="view" width="1120" height="600" role="img" aria-label="同じ盤面の前回と今回の演出"></canvas>
<p><label>時刻 <input id="timeline" type="range" min="0" max="160" value="0"><output id="time">0.000秒</output></label>　<a id="download" hidden>比較動画を保存</a></p>
<div id="frames"></div>
<details><summary>重ねている層</summary><ol id="layers"></ol></details>
<p>合体の前後は本物のゲーム計算で作り、連鎖の段だけ選んで比較します。ゲーム本体も同じ演出を使います。時間の停止・スローは本番の進行役に依頼します。照準と限界リングを見ながら確認してください。</p>
<script type="module" src="../src/dev/juice-demo.ts"></script></body></html>
