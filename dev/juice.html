<html lang="ja">
  <head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>合体と連鎖の演出 — GRAVITY CORE</title></head>
  <body>
    <header><h1>合体と連鎖</h1><p>圧縮、噴出、余響。合体の形と連鎖の強弱を比べます。</p><div id="demo-controls" aria-label="演出を比べる"></div></header>
    <main><div class="juice-stage"><canvas id="juice-board" aria-label="3案共通の盤面"></canvas><canvas id="juice-effects" aria-label="合体と連鎖の演出"></canvas></div><aside><h2 id="direction-name"></h2><p id="juice-status" role="status"></p><p id="juice-performance" role="status">通常20部品、連鎖5と超新星は各40部品。動画での審査はこれからです。</p><label>止めて見る時刻 <input id="juice-time" type="range" min="0" max="2500" step="10" value="280"/> <output id="juice-time-label">0.28秒</output></label><div id="juice-times"></div><label><input id="juice-reduced" type="checkbox"/> 動きを減らす</label><p>「1〜5連鎖」は形を比べる指定値。「実計算で5連鎖」は本物の連続合体です。時刻指定は形の見本へ戻ります。</p><a href="./chain.html">実際の5連鎖を大きく見る</a><br/><a href="./board.html">本番の描画を確認</a></aside><section id="juice-comparison" hidden><h2 id="juice-comparison-title">同じ出来事の3案</h2><div id="juice-frames"></div></section></main>
